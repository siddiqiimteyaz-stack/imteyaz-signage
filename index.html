<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMTEYAZ Barwa Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Password Lock Screen -->
  <div id="lockScreen" class="lockScreen">
    <div class="lockBox">
      <h2>🔒 IMTEYAZ SHOPPING</h2>
      <p>Password डालें</p>
      <input type="password" id="lockPassword" placeholder="Password" autocomplete="off">
      <button id="lockSubmitBtn">Unlock</button>
      <p id="lockError" class="lockError"></p>
    </div>
  </div>

  <div id="appContent" class="appContent" style="display:none;">

    <header class="topbar">
      <div class="logo">IMTEYAZ SHOPPING 🛍️</div>
      <div id="statusText">Ready</div>
    </header>

    <div id="clock" class="clock">--:--:--</div>

    <!-- QR Code (Presentation में दिखेगा) -->
    <div id="qrBox" class="qrBox">
      <img id="qrImage" src="" alt="QR Code">
      <p>Scan for Offers</p>
    </div>

    <div class="container">

      <div class="screen">
        <div id="welcome">
          <h1>Digital Signage System</h1>
          <p>Tap Add Media to create your playlist</p>
        </div>
        <img id="imagePlayer" alt="Image">
        <video id="videoPlayer"></video>
      </div>

      <!-- साइड फ्लोटिंग कंट्रोल बटन -->
      <div id="sideControls" class="sideControls">
        <button id="toggleControlsBtn" class="sideBtn">☰</button>
        <div id="controlsPanel" class="controlsPanel">
          <button id="playBtn" title="Play">▶</button>
          <button id="pauseBtn" title="Pause">⏸</button>
          <button id="prevBtn" title="Previous">⏮</button>
          <button id="nextBtn" title="Next">⏭</button>
          <button id="muteBtn" title="Mute">🔇</button>
          <button id="fullscreenBtn" title="Presentation">⛶</button>
          <button id="exitPresentationBtn" title="Exit">✕</button>
          <button id="settingsBtn" title="Settings">⚙️</button>
        </div>
      </div>

      <!-- सेटिंग्स पैनल (पासवर्ड से लॉक) -->
      <div id="settingsPanel" class="settingsPanel">
        <div class="settingsBox">
          <h3>Settings</h3>
          <button id="addBtn">➕ Add Media</button>
          <button id="saveBtn">💾 Save Playlist</button>
          <button id="loadBtn">📂 Load Playlist</button>
          
          <label>QR Code Image:</label>
          <input type="file" id="qrFile" accept="image/*">
          
          <input type="text" id="tickerInput" placeholder="Ticker मैसेज लिखें...">
          <button id="tickerSaveBtn">Save Ticker</button>
          
          <button id="closeSettingsBtn">Close</button>
        </div>
      </div>

      <!-- Hidden File Pickers -->
      <input type="file" id="filePicker" accept="image/*,video/*" multiple hidden>
      <input type="file" id="playlistLoader" multiple accept="image/*,video/*" style="display:none;">

      <div class="playlistBox">
        <h2>Playlist</h2>
        <ul id="playlist"></ul>
      </div>

    </div>

    <!-- Ticker -->
    <div class="ticker-wrap">
      <div class="ticker" id="tickerText">हमारे दुकान में आपका स्वागत है • आज का विशेष ऑफर • धन्यवाद</div>
    </div>

  </div><!-- /appContent -->

  <script src="script.js"></script>
</body>
</html>
