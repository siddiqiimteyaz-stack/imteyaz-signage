<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMTEYAZ Barwa Online Shopping</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">
        IMTEYAZ SHOPPING 🛍️ 
    </div>

    <div id="statusText">
        Ready
    </div>

</header>

<div id="clock" class="clock">--:--:--</div>


<div class="container">

    <!-- ========================= -->
    <!-- Player Screen -->
    <!-- ========================= -->

    <div class="screen">

        <div id="welcome">

            <h1>Digital Signage System</h1>

            <p>
                Tap Add Media to create your playlist
            </p>

        </div>

        <img
            id="imagePlayer"
            alt="Image">

        <video
            id="videoPlayer"
            controls>
        </video>

    </div>


    <!-- ========================= -->
    <!-- Toolbar -->
    <!-- ========================= -->

    <div class="toolbar">

        <button id="addBtn">
            ➕ Add Media
        </button>

        <button id="playBtn">
            ▶ Play
        </button>

        <button id="pauseBtn">
            ⏸ Pause
        </button>

        <button id="prevBtn">
            ⏮ Prev
        </button>

        <button id="nextBtn">
            ⏭ Next
        </button>
        
        <button id="saveBtn">💾 Save</button>

<button id="loadBtn">📂 Load</button>

<button id="fullscreenBtn">⛶ Presentation</button>

<select id="imageDuration">
    <option value="3">Image: 3 sec</option>
    <option value="5" selected>Image: 5 sec</option>
    <option value="8">Image: 8 sec</option>
    <option value="10">Image: 10 sec</option>
    <option value="15">Image: 15 sec</option>
</select>

<button id="muteBtn">🔇 Mute</button>

<button id="exitPresentationBtn">Exit Presentation</button>

<input type="text" id="tickerInput" placeholder="यहाँ अपना मैसेज लिखें..." style="width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px;">
<button id="tickerSaveBtn">Save Ticker</button>

<div class="ticker-wrap">
    <div class="ticker" id="tickerText">हमारे दुकान में आपका स्वागत है • आज का विशेष ऑफर • धन्यवाद</div>
</div>

    </div>


    <!-- Hidden File Picker -->

    <input
        type="file"
        id="filePicker"
        accept="image/*,video/*"
        multiple
        hidden>
    <input
    type="file"
    id="playlistLoader"
    multiple
    accept="image/*,video/*"
    style="display:none;">


    <!-- ========================= -->
    <!-- Playlist -->
    <!-- ========================= -->

    <div class="playlistBox">

        <h2>
            Playlist
        </h2>

        <ul id="playlist">

        </ul>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
